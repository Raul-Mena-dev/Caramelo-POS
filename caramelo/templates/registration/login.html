{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login - {{ negocio.nombre_comercial }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h4 class="text-center mb-3 d-flex justify-content-center align-items-center gap-2">
            {% if negocio.logo_url %}<img src="{{ negocio.logo_url }}" alt="{{ negocio.nombre_comercial }}" width="28" height="28">{% endif %}
            <span>{{ negocio.nombre_comercial }}</span>
          </h4>

          {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos</div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <input name="username" class="form-control mb-2" placeholder="Usuario" required autofocus>
            <input name="password" type="password" class="form-control mb-3" placeholder="Contraseña" required>
            <button class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
